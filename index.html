/* ===== 2. NOVEL SETTINGS ===== */
const MM = {
  title: "Middlemarch: who’s connected to whom",
  nodes: MM_NODES, edges: MM_EDGES, pos: MM_POS,
  chapters: Array.from({ length: 71 }, (_, i) => ({ short: String(i + 1), tip: "Chapter " + (i + 1), nav: `Chapter ${i + 1} of 71` }))
};
const OMF = {
  title: "Our Mutual Friend: who’s connected to whom",
  nodes: OMF_NODES, edges: OMF_EDGES, pos: OMF_POS,
  chapters: OB.flatMap((n, b) => Array.from({ length: n }, (_, i) => ({
    short: String(i + 1), tip: `Book ${b + 1}, Chapter ${i + 1}`, nav: `Book ${b + 1}, Chapter ${i + 1}`,
    tag: i === 0 ? "Book " + (b + 1) : null })))
};

/* ===== 3. SHARED HELPERS ===== */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const narrow = matchMedia("(max-width: 760px)");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function buildStyle(el) {
  const css = v => getComputedStyle(el).getPropertyValue(v).trim();
  const base = [
    { selector: "node", style: {
        "label": "data(name)", "text-valign": "bottom", "text-margin-y": 6,
        "text-wrap": "wrap", "text-max-width": 90, "font-size": 12,
        "font-family": "Spectral, Georgia, serif", "color": css("--ink"),
        "background-color": css("--node"), "width": 30, "height": 30,
        "border-width": 0, "overlay-opacity": 0 } },
    { selector: "node.dead", style: { "background-color": css("--dead"), "color": css("--muted") } },
    { selector: "node:selected", style: { "border-width": 4, "border-color": css("--sel") } },
    { selector: "edge", style: { "curve-style": "bezier", "width": 2.5, "opacity": .9, "overlay-opacity": 0 } },
    { selector: "edge.faded", style: { "opacity": .4 } },
    { selector: "edge:selected", style: { "width": 5 } },
    { selector: ".hidden, .absent", style: { "display": "none" } }
  ];
  Object.entries(EDGE_TYPES).forEach(([key, t]) => {
    base.push({ selector: `edge[type="${key}"]`, style: { "line-color": css(t.color), "line-style": t.style } });
  });
  return base;
}

function buildLegend(box, onToggle) {
  Object.entries(EDGE_TYPES).forEach(([key, t]) => {
    const btn = document.createElement("button");
    btn.setAttribute("aria-pressed", "true");
    btn.innerHTML = `<span class="swatch ${t.style}" style="--c: var(${t.color})"></span>${t.label}`;
    btn.addEventListener("click", () => {
      const on = btn.getAttribute("aria-pressed") === "true";
      btn.setAttribute("aria-pressed", String(!on));
      onToggle(key, on);
    });
    box.appendChild(btn);
  });
}

// New nodes grow from a dot; new links fade in and thicken a moment later.
function grow(els) {
  if (reduceMotion) return;
  els.forEach(el => {
    el.stop(true);
    if (el.isNode()) {
      el.style({ width: 4, height: 4, "text-opacity": 0 });
      el.animate({ style: { width: 30, height: 30, "text-opacity": 1 } },
        { duration: 400, easing: "ease-out-cubic", complete: () => el.removeStyle("width height text-opacity") });
    } else {
      const o = el.numericStyle("opacity"), w = el.numericStyle("width");
      el.style({ opacity: 0, width: 0.5 });
      el.delay(150).animate({ style: { opacity: o, width: w } },
        { duration: 350, easing: "ease-out-cubic", complete: () => el.removeStyle("opacity width") });
    }
  });
}

/* ===== 4. ONE NOVEL = ONE GRAPH (with timeline and panel when interactive) ===== */
function createNovel(cfg, pane, interactive) {
  const total = cfg.chapters.length;
  const nodeById = Object.fromEntries(cfg.nodes.map(n => [n.id, n]));
  const $ = s => pane.querySelector(s);
  let current = interactive ? 1 : total, selected = null, fitted = false, tlKey = "";

  const nodePresent = (n, c) => c >= n.from;
  const nodeDead = (n, c) => n.died != null && c >= n.died;
  const edgePresent = (e, c) =>
    c >= e.from && (e.until == null || c < e.until) && nodePresent(nodeById[e.a], c) && nodePresent(nodeById[e.b], c);

  if (interactive) {
    pane.innerHTML = `
      <div class="nhead"><h1>${esc(cfg.title)}</h1>
        <div class="chnav"><button class="prev" aria-label="Previous chapter">‹</button>
          <span class="chLabel" aria-live="polite"></span>
          <button class="next" aria-label="Next chapter">›</button></div></div>
      <div class="timeline" aria-label="Chapter timeline"></div>
      <div class="legend"></div>
      <main><div class="cy" role="img" aria-label="${esc(cfg.title)}"></div>
        <aside class="info" aria-live="polite"></aside></main>`;
  }

  const cy = cytoscape({
    container: $(".cy"),
    elements: [
      ...cfg.nodes.map(n => ({ data: { id: n.id, name: n.name } })),
      ...cfg.edges.map((e, i) => ({ data: { id: "e" + i, source: e.a, target: e.b, type: e.type } }))
    ],
    style: buildStyle(pane),
    layout: { name: "preset", positions: node => cfg.pos[node.id()], fit: false },
    wheelSensitivity: 0.25
  });

  // Fit using the fixed positions, so the view doesn't jump as characters appear.
  function fitAll() {
    const xs = Object.values(cfg.pos).map(p => p.x), ys = Object.values(cfg.pos).map(p => p.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const w = cy.width(), h = cy.height(), pad = 44;
    if (!w || !h) return;
    const z = Math.min(1.4, (w - 2 * pad) / ((x1 - x0) || 1), (h - 2 * pad) / ((y1 - y0) || 1));
    cy.zoom(z);
    cy.pan({ x: (w - z * (x0 + x1)) / 2, y: (h - z * (y0 + y1)) / 2 });
  }

  /* --- info panel --- */
  function refreshPanel() {
    if (!interactive) return;
    const info = $(".info"), EMPTY = '<p class="empty">Select a character or a link to see details.</p>';
    if (!selected) { info.innerHTML = EMPTY; return; }
    if (selected.kind === "node") {
      const n = nodeById[selected.id];
      if (!nodePresent(n, current)) { selected = null; info.innerHTML = EMPTY; return; }
      const links = cfg.edges.filter(e => (e.a === n.id || e.b === n.id) && edgePresent(e, current)).map(e => {
        const other = nodeById[e.a === n.id ? e.b : e.a];
        return `<li><b>${esc(EDGE_TYPES[e.type].label)}</b>: ${esc(other.name)}${e.note ? ". " + esc(e.note) : ""}</li>`;
      }).join("");
      info.innerHTML = `<h2>${esc(n.name)}</h2>${n.desc ? `<p>${esc(n.desc)}</p>` : ""}<ul>${links}</ul>`;
    } else {
      const e = cfg.edges[selected.i];
      if (!edgePresent(e, current)) { selected = null; info.innerHTML = EMPTY; return; }
      info.innerHTML = `<h2>${esc(nodeById[e.a].name)} and ${esc(nodeById[e.b].name)}</h2>
        <p class="role">${esc(EDGE_TYPES[e.type].label)}</p>${e.note ? `<p>${esc(e.note)}</p>` : ""}`;
    }
  }
  if (interactive) {
    cy.on("tap", "node", evt => { selected = { kind: "node", id: evt.target.id() }; refreshPanel(); });
    cy.on("tap", "edge", evt => { selected = { kind: "edge", i: Number(evt.target.id().slice(1)) }; refreshPanel(); });
    cy.on("tap", evt => { if (evt.target === cy) { selected = null; refreshPanel(); } });
  }

  /* --- timeline: folded rows on wide screens, one sideways-scrolling row on narrow ones --- */
  const tl = interactive ? $(".timeline") : null;
  const eventChapters = new Set();
  cfg.nodes.forEach(n => { eventChapters.add(n.from); if (n.died != null) eventChapters.add(n.died); });
  cfg.edges.forEach(e => { eventChapters.add(e.from); if (e.until != null) eventChapters.add(e.until); });
  eventChapters.delete(1);

  function drawTimeline() {
    if (!interactive) return;
    const single = narrow.matches;
    tl.classList.toggle("single", single);
    tlKey = window.innerWidth + "-" + single;
    const gap = 34, pad = 28, rh = 36, top = 24;
    const W = single ? 2 * pad + (total - 1) * gap : Math.max(tl.clientWidth - 24, 260);
    const per = single ? total : Math.max(6, Math.floor((W - 2 * pad) / gap) + 1);
    const ox = (W - (2 * pad + (per - 1) * gap)) / 2 + pad;
    const rows = Math.ceil(total / per);
    const H = top * 2 + (rows - 1) * rh;
    const pts = [];
    for (let i = 0; i < total; i++) {
      const row = Math.floor(i / per), k = i % per;
      pts.push({ c: i + 1, row, x: ox + (row % 2 ? per - 1 - k : k) * gap, y: top + row * rh });
    }
    let d = `M${pts[0].x} ${pts[0].y}`;
    for (let i = 1; i < pts.length; i++) {
      const p = pts[i], q = pts[i - 1];
      d += p.row === q.row ? ` L${p.x} ${p.y}` : ` A${rh / 2} ${rh / 2} 0 0 ${q.row % 2 === 0 ? 1 : 0} ${p.x} ${p.y}`;
    }
    const circles = pts.map(p => {
      const c = cfg.chapters[p.c - 1];
      return `<g class="ch" data-ch="${p.c}" tabindex="0" role="button" aria-label="${c.tip}">
        <circle cx="${p.x}" cy="${p.y}" r="11"></circle><text x="${p.x}" y="${p.y}">${c.short}</text><title>${c.tip}</title></g>` +
        (c.tag ? `<text class="btag" x="${p.x}" y="${p.y - 18}">${c.tag}</text>` : "");
    }).join("");
    tl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMidYMin meet">
      <path d="${d}" fill="none" stroke="var(--line)" stroke-width="2"></path>${circles}</svg>`;
    updateTimeline();
  }

  function updateTimeline() {
    if (!interactive) return;
    tl.querySelectorAll(".ch").forEach(g => {
      const c = Number(g.dataset.ch);
      g.classList.toggle("now", c === current);
      g.classList.toggle("past", c < current);
      g.classList.toggle("event", eventChapters.has(c));
      g.querySelector("circle").setAttribute("r", c === current ? 13 : 11);
    });
    if (tl.classList.contains("single")) {
      const cur = tl.querySelector(".ch.now circle");
      if (cur) tl.scrollTo({ left: Number(cur.getAttribute("cx")) - tl.clientWidth / 2, behavior: reduceMotion ? "auto" : "smooth" });
    }
  }

  /* --- chapter change --- */
  function setChapter(c, animate = true) {
    current = Math.min(total, Math.max(1, c));
    const entering = [];
    cy.batch(() => {
      cy.nodes().forEach(n => {
        const d = nodeById[n.id()];
        const was = n.hasClass("absent"), absent = !nodePresent(d, current);
        n.toggleClass("absent", absent);
        n.toggleClass("dead", nodeDead(d, current));
        if (was && !absent) entering.push(n);
      });
      cy.edges().forEach(el => {
        const e = cfg.edges[Number(el.id().slice(1))];
        const was = el.hasClass("absent"), absent = !edgePresent(e, current);
        el.toggleClass("absent", absent);
        el.toggleClass("faded", nodeDead(nodeById[e.a], current) || nodeDead(nodeById[e.b], current));
        if (was && !absent) entering.push(el);
      });
    });
    if (animate) grow(entering);
    if (interactive) {
      $(".chLabel").textContent = cfg.chapters[current - 1].nav;
      updateTimeline();
      refreshPanel();
    }
  }

  if (interactive) {
    buildLegend($(".legend"), (key, hide) => api.setTypeHidden(key, hide));
    $(".prev").addEventListener("click", () => setChapter(current - 1));
    $(".next").addEventListener("click", () => setChapter(current + 1));
    tl.addEventListener("click", e => { const g = e.target.closest(".ch"); if (g) setChapter(Number(g.dataset.ch)); });
    tl.addEventListener("keydown", e => {
      const g = e.target.closest(".ch");
      if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); setChapter(Number(g.dataset.ch)); }
    });
  }

  const api = {
    step: d => setChapter(current + d),
    setTypeHidden: (key, hide) => cy.edges(`[type="${key}"]`).toggleClass("hidden", hide),
    restyle: () => cy.style(buildStyle(pane)),
    show() {                                   // call when the tab becomes visible
      cy.resize();
      if (!fitted) { fitAll(); fitted = true; }
      drawTimeline();
    },
    onResize() {
      cy.resize(); fitAll();
      if (interactive && tlKey !== window.innerWidth + "-" + narrow.matches) drawTimeline();
    }
  };
  setChapter(current, false);
  return api;
}

/* ===== 5. THEME ===== */
const THEME_KEY = "mm-theme", TAB_KEY = "mm-tab";
const sysDark = matchMedia("(prefers-color-scheme: dark)");
const ICON = 'viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const SUN = `<svg ${ICON}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const MOON = `<svg ${ICON}><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
function applyTheme(name, save) {
  document.documentElement.dataset.theme = name;
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = name === "dark" ? SUN : MOON;
  btn.setAttribute("aria-label", name === "dark" ? "Switch to light mode" : "Switch to dark mode");
  if (save) store(THEME_KEY, name);
  document.dispatchEvent(new Event("themechange"));
}
applyTheme(store(THEME_KEY) || (sysDark.matches ? "dark" : "light"), false);

/* ===== 6. BUILD THE FOUR GRAPHS AND THE TABS ===== */
const views = {
  mm: createNovel(MM, document.getElementById("pane-mm"), true),
  omf: createNovel(OMF, document.getElementById("pane-omf"), true),
  mmFinal: createNovel(MM, document.getElementById("col-mm"), false),
  omfFinal: createNovel(OMF, document.getElementById("col-omf"), false)
};
const tabViews = { mm: [views.mm], omf: [views.omf], cmp: [views.mmFinal, views.omfFinal] };
buildLegend(document.getElementById("cmpLegend"), (key, hide) => {
  views.mmFinal.setTypeHidden(key, hide); views.omfFinal.setTypeHidden(key, hide);
});

let activeTab = "mm";
function showTab(id) {
  activeTab = id;
  document.getElementById("app").dataset.novel = id;
  document.querySelectorAll(".tabbtn").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
  ["mm", "omf", "cmp"].forEach(k => { document.getElementById("pane-" + k).hidden = k !== id; });
  tabViews[id].forEach(v => v.show());
  store(TAB_KEY, id);
}
document.querySelectorAll(".tabbtn").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));

document.getElementById("themeBtn").addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
sysDark.addEventListener("change", e => { if (!store(THEME_KEY)) applyTheme(e.matches ? "dark" : "light", false); });
document.addEventListener("themechange", () => Object.values(views).forEach(v => v.restyle()));
window.addEventListener("resize", () => tabViews[activeTab].forEach(v => v.onResize()));
document.addEventListener("keydown", e => {
  if (activeTab === "cmp") return;
  if (e.key === "ArrowRight") views[activeTab].step(1);
  if (e.key === "ArrowLeft") views[activeTab].step(-1);
});

const savedTab = store(TAB_KEY);
showTab(["mm", "omf", "cmp"].includes(savedTab) ? savedTab : "mm");
</script>
