<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Middlemarch: character network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root {
    --bg: #eceef7; --surface: #fbfbfe; --ink: #1f2340; --muted: #5b6080; --line: #d0d4e8;
    --node: #3a47a0; --node-text: #ffffff; --sel: #e0561f; --dead: #a6aac0;
    --c-marriage: #c62d4a; --c-romance: #d6458f; --c-family: #7a809c;
    --c-friend: #2e9a5b; --c-conflict: #d98a00; --c-social: #1f7ac4; --c-work: #8a3fb8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12181a; --surface: #1b2326; --ink: #e6ecec; --muted: #93a2a6; --line: #34433f;
      --node: #5fa3aa; --node-text: #0f1517; --sel: #f08a6c; --dead: #5b676a;
      --c-marriage: #e2745a; --c-romance: #e08fb2; --c-family: #92a3a8;
      --c-friend: #6fc28c; --c-conflict: #e0a84a; --c-social: #7aa6e0; --c-work: #b49be0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181a; --surface: #1b2326; --ink: #e6ecec; --muted: #93a2a6; --line: #34433f;
    --node: #5fa3aa; --node-text: #0f1517; --sel: #f08a6c; --dead: #5b676a;
    --c-marriage: #e2745a; --c-romance: #e08fb2; --c-family: #92a3a8;
    --c-friend: #6fc28c; --c-conflict: #e0a84a; --c-social: #7aa6e0; --c-work: #b49be0;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Spectral", Georgia, "Times New Roman", serif; display: flex; flex-direction: column; }
  header { padding: 14px 20px 6px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; }
  h1 { margin: 0; font-size: 1.35rem; font-weight: 600; }
  .chnav { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: .95rem; }
  .chnav button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    width: 30px; height: 28px; cursor: pointer; font: inherit; }
  .chnav button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  #chLabel { min-width: 8.5em; text-align: center; font-weight: 600; }
  .themebtn { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 50%;
    width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  .themebtn:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  #timeline { max-height: 30vh; overflow-y: auto; padding: 0 12px; }
  #timeline svg { display: block; width: 100%; }
  #timeline.single { max-height: none; overflow-x: auto; overflow-y: hidden; }
  #timeline.single svg { width: auto; max-width: none; }
  .ch { cursor: pointer; outline: none; }
  .ch circle { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
  .ch text { fill: var(--ink); font-size: 10px; text-anchor: middle; dominant-baseline: central; pointer-events: none;
    font-family: "Spectral", Georgia, serif; }
  .ch.past circle { fill: var(--node); stroke: var(--node); }
  .ch.past text { fill: var(--node-text); }
  .ch.event circle { stroke: var(--ink); stroke-width: 2.5; }
  .ch.now circle { fill: var(--sel); stroke: var(--sel); }
  .ch.now text { fill: #fff; font-weight: 600; }
  .ch:focus-visible circle { stroke: var(--sel); stroke-width: 3; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 6px 20px 10px; }
  .legend button { background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink);
    font: inherit; font-size: .88rem; display: flex; align-items: center; gap: 7px; }
  .legend button[aria-pressed="false"] { opacity: .4; }
  .legend button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  .swatch { width: 26px; height: 0; border-top: 3px solid var(--c); }
  .swatch.dashed { border-top-style: dashed; }
  .swatch.dotted { border-top-style: dotted; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 320px; }
  #cy { min-height: 300px; background: var(--surface); border-top: 1px solid var(--line); }
  aside { padding: 18px 20px; border-top: 1px solid var(--line); border-left: 1px solid var(--line); overflow-y: auto; }
  aside h2 { margin: 0 0 6px; font-size: 1.25rem; font-weight: 600; }
  aside .role { margin: 0 0 12px; color: var(--muted); font-style: italic; }
  aside p { line-height: 1.55; margin: 0 0 12px; }
  aside ul { padding: 0; margin: 0; list-style: none; }
  aside li { margin: 0 0 6px; font-size: .92rem; }
  aside li b { font-weight: 600; }
  .empty { color: var(--muted); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; }
    #cy { min-height: 220px; }
    aside { border-left: 0; min-height: 120px; max-height: 38vh; }
    .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; }
    .legend button { flex: none; white-space: nowrap; }
  }
</style>
</head>
<body>
<header>
  <h1>Middlemarch: a small world network?</h1>
  <div class="chnav">
    <button id="prev" aria-label="Previous chapter">‹</button>
    <span id="chLabel" aria-live="polite"></span>
    <button id="next" aria-label="Next chapter">›</button>
  </div>
  <button id="themeBtn" class="themebtn" title="Switch theme"></button>
</header>
<div id="timeline" aria-label="Chapter timeline"></div>
<div class="legend" id="legend"></div>
<main>
  <div id="cy" role="img" aria-label="Network diagram of Middlemarch characters"></div>
  <aside id="info" aria-live="polite"><p class="empty">Select a character or a link to see details.</p></aside>
</main>

<script>
/* ===== 1. DATA: edit this section ===== */
const TOTAL = 71;            // Books 1-7 (chapters 1-71). Book 8 and the Finale are left out.

const EDGE_TYPES = {
  marriage: { label: "Marriage",   color: "--c-marriage", style: "solid"  },
  romance:  { label: "Romance",    color: "--c-romance",  style: "dashed" },
  family:   { label: "Family",     color: "--c-family",   style: "solid"  },
  friend:   { label: "Friendship", color: "--c-friend",   style: "solid"  },
  conflict: { label: "Tension",    color: "--c-conflict", style: "dotted" },
  social:   { label: "Social",     color: "--c-social",   style: "solid"  },
  work:     { label: "Work",       color: "--c-work",     style: "solid"  }
};

// from: chapter the character first appears. died: chapter they die (node turns grey). Omit if alive.
// Chapter numbers were checked against LitCharts where noted in the reply; the rest are best guesses.
const NODES = [
  { id: "dorothea",  name: "Dorothea Brooke",    desc: "", from: 1 },
  { id: "celia",     name: "Celia Brooke",       desc: "", from: 1 },
  { id: "brooke",    name: "Mr Brooke",          desc: "", from: 1 },
  { id: "chettam",   name: "James Chettam",      desc: "", from: 1 },
  { id: "casaubon",  name: "Edward Casaubon",    desc: "", from: 2, died: 48 },
  { id: "mrscad",    name: "Mrs Cadwallader",    desc: "", from: 6 },
  { id: "mrcad",     name: "Mr Cadwallader",     desc: "", from: 7 },
  { id: "lydgate",   name: "Tertius Lydgate",    desc: "", from: 11 },
  { id: "rosamond",  name: "Rosamond Vincy",     desc: "", from: 11 },
  { id: "fred",      name: "Fred Vincy",         desc: "", from: 11 },
  { id: "mary",      name: "Mary Garth",         desc: "", from: 12 },
  { id: "feather",   name: "Peter Featherstone", desc: "", from: 12, died: 33 },
  { id: "bulstrode", name: "Nicholas Bulstrode", desc: "", from: 13 },
  { id: "harriet",   name: "Harriet Bulstrode",  desc: "", from: 13 },
  { id: "fare",      name: "Farebrother",        desc: "", from: 17 },
  { id: "will",      name: "Will Ladislaw",      desc: "", from: 21 },
  { id: "caleb",     name: "Caleb Garth",        desc: "", from: 24 },
  { id: "susan",     name: "Susan Garth",        desc: "", from: 24 },
  { id: "mrsvincy",  name: "Mrs. Vincy",         desc: "", from: 11 },
  { id: "mrvincy",   name: "Mr. Vincy",          desc: "", from: 11 },
  { id: "rigg",      name: "Joshua Rigg",        desc: "", from: 35 },
  { id: "raffles",   name: "John Raffles",       desc: "", from: 41 , died: 70}
];

const POSITIONS = {
  dorothea: { x: 300, y: 240 }, casaubon: { x: 150, y: 140 }, will: { x: 340, y: 80 },
  celia: { x: 170, y: 360 },    brooke: { x: 340, y: 390 },
  lydgate: { x: 570, y: 240 },  rosamond: { x: 730, y: 150 }, fred: { x: 790, y: 300 },
  mary: { x: 700, y: 410 },     bulstrode: { x: 520, y: 400 },
  harriet: { x: 620, y: 80 },   caleb: { x: 640, y: 520 },    susan: { x: 780, y: 500 },
  feather: { x: 910, y: 380 },  fare: { x: 650, y: 330 },
  chettam: { x: 40, y: 260 },   mrscad: { x: 110, y: 460 },   mrcad: { x: 250, y: 490 }
};

// from: first chapter the link exists. until: first chapter it is gone (omit if it lasts).
// note: optional text shown when the link is clicked.
const EDGES = [
  { a: "dorothea", b: "celia",     type: "family",   from: 1,  note: "" },
  { a: "dorothea", b: "brooke",    type: "family",   from: 1,  note: "" },
  { a: "celia",    b: "brooke",    type: "family",   from: 1,  note: "" },
  { a: "chettam",  b: "brooke",    type: "social",   from: 1,  note: "" },
  { a: "chettam",  b: "dorothea",  type: "romance",  from: 1, until: 6,  note: "" },
  { a: "dorothea", b: "casaubon",  type: "romance",  from: 5, until: 10, note: "" },
  { a: "dorothea", b: "casaubon",  type: "marriage", from: 10, note: "" },
  { a: "mrscad",   b: "mrcad",     type: "marriage", from: 7,  note: "" },
  { a: "mrscad",   b: "brooke",    type: "social",   from: 6,  note: "" },
  { a: "mrscad",   b: "dorothea",  type: "social",   from: 6,  note: "" },
  { a: "mrscad",   b: "chettam",   type: "social",   from: 6,  note: "" },
  { a: "fred",     b: "rosamond",  type: "family",   from: 11, note: "" },
  { a: "fred",     b: "mary",      type: "romance",  from: 12, note: "" },
  { a: "feather",  b: "fred",      type: "family",   from: 12, note: "" },
  { a: "feather",  b: "mary",      type: "work",     from: 12, note: "" },
  { a: "lydgate",  b: "bulstrode", type: "work",     from: 13, note: "" },
  { a: "bulstrode",b: "harriet",   type: "marriage", from: 13, note: "" },
  { a: "harriet",  b: "fred",      type: "family",   from: 13, note: "" },
  { a: "harriet",  b: "rosamond",  type: "family",   from: 13, note: "" },
  { a: "fare",     b: "lydgate",   type: "friend",   from: 17, note: "" },
  { a: "dorothea", b: "will",      type: "romance",  from: 21, note: "" },
  { a: "casaubon", b: "will",      type: "family",   from: 21, note: "" },
  { a: "caleb",    b: "susan",     type: "marriage", from: 24, note: "" },
  { a: "caleb",    b: "mary",      type: "family",   from: 24, note: "" },
  { a: "susan",    b: "mary",      type: "family",   from: 24, note: "" },
  { a: "feather",  b: "caleb",     type: "family",   from: 24, note: "" },
  { a: "fare",     b: "fred",      type: "friend",   from: 17, note: "" },
  { a: "lydgate",  b: "rosamond",  type: "romance",  from: 27, until: 40, note: "" },
  { a: "celia",    b: "chettam",   type: "romance",  from: 28, until: 34, note: "" },
  { a: "celia",    b: "chettam",   type: "marriage", from: 34, note: "" },
  { a: "dorothea", b: "lydgate",   type: "friend",   from: 30, note: "" },
  { a: "lydgate",  b: "rosamond",  type: "marriage", from: 40, note: "" },
  { a: "lydgate",  b: "fred",      type: "family",   from: 40, note: "" },
  { a: "casaubon", b: "will",      type: "conflict", from: 34, note: "" },
  { a: "brooke",   b: "will",      type: "work",     from: 30, note: "" },
  { a: "caleb",    b: "fred",      type: "work",     from: 56, note: "" },
  { a: "mrvincy",  b: "fred",      type: "family",   from: 11, note: "" },
  { a: "mrsvincy", b: "fred",      type: "family",   from: 11, note: "" },
  { a: "mrvincy",  b: "mrsvincy",  type: "family",   from: 11, note: "" },
  { a: "mrvincy",  b: "rosamond",  type: "family",   from: 11, note: "" },
  { a: "mrsvincy", b: "rosamond",  type: "family",   from: 11, note: "" },
  { a: "mrvincy",  b: "lydgate",   type: "family",   from: 40, note: "" },
  { a: "mrsvincy", b: "lydgate",   type: "family",   from: 40, note: "" },
  { a: "rigg",     b: "feather",   type: "family",   from: 35, note: "" },
  { a: "rigg",     b: "raffles",   type: "family",   from: 41, note: "" },
  { a: "raffles",  b: "bulstrode", type: "social",   from: 53, note: "" },
  { a: "will",     b: "bulstrode", type: "family",   from: 53, note: "" },
];

/* ===== 2. STATE HELPERS ===== */
const nodeById = Object.fromEntries(NODES.map(n => [n.id, n]));
let current = 1;
let selected = null;   // { kind: "node", id } or { kind: "edge", i }

const nodePresent = (n, c) => c >= n.from;
const nodeDead = (n, c) => n.died != null && c >= n.died;
const edgePresent = (e, c) =>
  c >= e.from && (e.until == null || c < e.until) &&
  nodePresent(nodeById[e.a], c) && nodePresent(nodeById[e.b], c);
const chapterName = c => "Chapter " + c;

/* ===== 3. GRAPH ===== */
/* Theme: saved choice, else the system setting */
const THEME_KEY = "mm-theme";
const sysDark = matchMedia("(prefers-color-scheme: dark)");
const ICON = 'viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const SUN = `<svg ${ICON}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
const MOON = `<svg ${ICON}><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
const storedTheme = () => { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } };
function applyTheme(name, save) {
  document.documentElement.dataset.theme = name;
  const btn = document.getElementById("themeBtn");
  btn.innerHTML = name === "dark" ? SUN : MOON;
  btn.setAttribute("aria-label", name === "dark" ? "Switch to light mode" : "Switch to dark mode");
  if (save) { try { localStorage.setItem(THEME_KEY, name); } catch (e) {} }
  document.dispatchEvent(new Event("themechange"));
}
applyTheme(storedTheme() || (sysDark.matches ? "dark" : "light"), false);
document.getElementById("themeBtn").addEventListener("click", () =>
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true));
sysDark.addEventListener("change", e => { if (!storedTheme()) applyTheme(e.matches ? "dark" : "light", false); });

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function buildStyle() {
  const base = [
    { selector: "node", style: {
        "label": "data(name)", "text-valign": "bottom", "text-margin-y": 6,
        "text-wrap": "wrap", "text-max-width": 90, "font-size": 12,
        "font-family": "Spectral, Georgia, serif", "color": css("--ink"),
        "background-color": css("--node"), "width": 30, "height": 30,
        "border-width": 0, "overlay-opacity": 0 } },
    { selector: "node.dead", style: { "background-color": css("--dead"), "color": css("--muted") } },
    { selector: "node:selected", style: { "border-width": 4, "border-color": css("--sel") } },
    { selector: "edge", style: { "curve-style": "bezier", "width": 2.5, "opacity": .9, "overlay-opacity": 0 } },
    { selector: "edge.faded", style: { "opacity": .4 } },
    { selector: "edge:selected", style: { "width": 5 } },
    { selector: ".hidden, .absent", style: { "display": "none" } }
  ];
  Object.entries(EDGE_TYPES).forEach(([key, t]) => {
    base.push({ selector: `edge[type="${key}"]`, style: { "line-color": css(t.color), "line-style": t.style } });
  });
  return base;
}

const cy = cytoscape({
  container: document.getElementById("cy"),
  elements: [
    ...NODES.map(n => ({ data: { id: n.id, name: n.name } })),
    ...EDGES.map((e, i) => ({ data: { id: "e" + i, source: e.a, target: e.b, type: e.type } }))
  ],
  style: buildStyle(),
  layout: { name: "preset", positions: node => POSITIONS[node.id()], padding: 40 },
  wheelSensitivity: 0.25
});

document.addEventListener("themechange", () => cy.style(buildStyle()));
window.addEventListener("resize", () => cy.resize());

/* ===== 4. LEGEND ===== */
const legend = document.getElementById("legend");
Object.entries(EDGE_TYPES).forEach(([key, t]) => {
  const btn = document.createElement("button");
  btn.setAttribute("aria-pressed", "true");
  btn.innerHTML = `<span class="swatch ${t.style}" style="--c: var(${t.color})"></span>${t.label}`;
  btn.addEventListener("click", () => {
    const on = btn.getAttribute("aria-pressed") === "true";
    btn.setAttribute("aria-pressed", String(!on));
    cy.edges(`[type="${key}"]`).toggleClass("hidden", on);
  });
  legend.appendChild(btn);
});

/* ===== 5. INFO PANEL (shows only what exists in the current chapter) ===== */
const info = document.getElementById("info");
const EMPTY = '<p class="empty">Select a character or a link to see details.</p>';
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function refreshPanel() {
  if (!selected) { info.innerHTML = EMPTY; return; }
  if (selected.kind === "node") {
    const n = nodeById[selected.id];
    if (!nodePresent(n, current)) { selected = null; info.innerHTML = EMPTY; return; }
    const links = EDGES.filter(e => (e.a === n.id || e.b === n.id) && edgePresent(e, current)).map(e => {
      const other = nodeById[e.a === n.id ? e.b : e.a];
      return `<li><b>${esc(EDGE_TYPES[e.type].label)}</b>: ${esc(other.name)}${e.note ? ". " + esc(e.note) : ""}</li>`;
    }).join("");
    info.innerHTML = `<h2>${esc(n.name)}</h2>${n.desc ? `<p>${esc(n.desc)}</p>` : ""}<ul>${links}</ul>`;
  } else {
    const e = EDGES[selected.i];
    if (!edgePresent(e, current)) { selected = null; info.innerHTML = EMPTY; return; }
    info.innerHTML = `<h2>${esc(nodeById[e.a].name)} and ${esc(nodeById[e.b].name)}</h2>
      <p class="role">${esc(EDGE_TYPES[e.type].label)}</p>${e.note ? `<p>${esc(e.note)}</p>` : ""}`;
  }
}

cy.on("tap", "node", evt => { selected = { kind: "node", id: evt.target.id() }; refreshPanel(); });
cy.on("tap", "edge", evt => { selected = { kind: "edge", i: Number(evt.target.id().slice(1)) }; refreshPanel(); });
cy.on("tap", evt => { if (evt.target === cy) { selected = null; refreshPanel(); } });

/* ===== 6. TIMELINE (a folded, snaking row of chapter circles) ===== */
const tl = document.getElementById("timeline");
const eventChapters = new Set();
NODES.forEach(n => { eventChapters.add(n.from); if (n.died != null) eventChapters.add(n.died); });
EDGES.forEach(e => { eventChapters.add(e.from); if (e.until != null) eventChapters.add(e.until); });
eventChapters.delete(1);

const narrow = matchMedia("(max-width: 760px)");
let tlKey = "";

// Wide screens: the chapters fold into rows. Narrow screens: one long row you scroll sideways.
function drawTimeline() {
  const single = narrow.matches;
  tl.classList.toggle("single", single);
  tlKey = window.innerWidth + "-" + single;
  const gap = 34, pad = 28, rh = 36, top = 20;
  const W = single ? 2 * pad + (TOTAL - 1) * gap : Math.max(tl.clientWidth - 24, 260);
  const per = single ? TOTAL : Math.max(6, Math.floor((W - 2 * pad) / gap) + 1);
  const ox = (W - (2 * pad + (per - 1) * gap)) / 2 + pad;
  const rows = Math.ceil(TOTAL / per);
  const H = top * 2 + (rows - 1) * rh;
  const pts = [];
  for (let i = 0; i < TOTAL; i++) {
    const row = Math.floor(i / per), k = i % per;
    pts.push({ c: i + 1, row, x: ox + (row % 2 ? per - 1 - k : k) * gap, y: top + row * rh });
  }
  let d = `M${pts[0].x} ${pts[0].y}`;
  for (let i = 1; i < pts.length; i++) {
    const p = pts[i], q = pts[i - 1];
    d += p.row === q.row ? ` L${p.x} ${p.y}` : ` A${rh / 2} ${rh / 2} 0 0 ${q.row % 2 === 0 ? 1 : 0} ${p.x} ${p.y}`;
  }
  const circles = pts.map(p => `<g class="ch" data-ch="${p.c}" tabindex="0" role="button" aria-label="${chapterName(p.c)}">
      <circle cx="${p.x}" cy="${p.y}" r="11"></circle>
      <text x="${p.x}" y="${p.y}">${p.c}</text>
      <title>${chapterName(p.c)}</title></g>`).join("");
  tl.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" preserveAspectRatio="xMidYMin meet">
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="2"></path>${circles}</svg>`;
  updateTimeline();
}

function updateTimeline() {
  tl.querySelectorAll(".ch").forEach(g => {
    const c = Number(g.dataset.ch);
    g.classList.toggle("now", c === current);
    g.classList.toggle("past", c < current);
    g.classList.toggle("event", eventChapters.has(c));
    g.querySelector("circle").setAttribute("r", c === current ? 13 : 11);
  });
  if (tl.classList.contains("single")) {
    const cur = tl.querySelector(".ch.now circle");
    if (cur) tl.scrollTo({ left: Number(cur.getAttribute("cx")) - tl.clientWidth / 2, behavior: reduceMotion ? "auto" : "smooth" });
  }
}

tl.addEventListener("click", e => {
  const g = e.target.closest(".ch"); if (g) setChapter(Number(g.dataset.ch));
});
tl.addEventListener("keydown", e => {
  const g = e.target.closest(".ch");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); setChapter(Number(g.dataset.ch)); }
});
window.addEventListener("resize", () => {
  if (tlKey !== window.innerWidth + "-" + narrow.matches) drawTimeline();
});

/* ===== 7. CHAPTER CHANGE ===== */
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// New nodes grow from a dot; new links fade in and thicken a moment later.
function grow(els) {
  if (reduceMotion) return;
  els.forEach(el => {
    el.stop(true);
    if (el.isNode()) {
      el.style({ width: 4, height: 4, "text-opacity": 0 });
      el.animate({ style: { width: 30, height: 30, "text-opacity": 1 } },
        { duration: 400, easing: "ease-out-cubic", complete: () => el.removeStyle("width height text-opacity") });
    } else {
      const o = el.numericStyle("opacity"), w = el.numericStyle("width");
      el.style({ opacity: 0, width: 0.5 });
      el.delay(150).animate({ style: { opacity: o, width: w } },
        { duration: 350, easing: "ease-out-cubic", complete: () => el.removeStyle("opacity width") });
    }
  });
}

function setChapter(c) {
  current = Math.min(TOTAL, Math.max(1, c));
  const entering = [];
  cy.batch(() => {
    cy.nodes().forEach(n => {
      const d = nodeById[n.id()];
      const was = n.hasClass("absent"), absent = !nodePresent(d, current);
      n.toggleClass("absent", absent);
      n.toggleClass("dead", nodeDead(d, current));
      if (was && !absent) entering.push(n);
    });
    cy.edges().forEach(el => {
      const e = EDGES[Number(el.id().slice(1))];
      const was = el.hasClass("absent"), absent = !edgePresent(e, current);
      el.toggleClass("absent", absent);
      el.toggleClass("faded", nodeDead(nodeById[e.a], current) || nodeDead(nodeById[e.b], current));
      if (was && !absent) entering.push(el);
    });
  });
  grow(entering);
  document.getElementById("chLabel").textContent = `Chapter ${current} of ${TOTAL}`;
  updateTimeline();
  refreshPanel();
}

document.getElementById("prev").addEventListener("click", () => setChapter(current - 1));
document.getElementById("next").addEventListener("click", () => setChapter(current + 1));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") setChapter(current + 1);
  if (e.key === "ArrowLeft") setChapter(current - 1);
});

drawTimeline();
setChapter(1);
</script>
